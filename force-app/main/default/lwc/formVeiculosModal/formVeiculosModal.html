<template>
<!-- Modal para cadastro de veículos
        Titulo  -->
    <lightning-modal-header label="Cadastrar novo veículo" ></lightning-modal-header>
    <!-- Conteúdo -->
    <lightning-modal-body class="slds-p-around_medium">
        <lightning-record-edit-form object-api-name="Veiculo__c">
            <lightning-input-field field-name="Marca__c" required data-id="marca"></lightning-input-field>
            <lightning-input-field field-name="Modelo__c" required data-id="modelo"></lightning-input-field>
            <lightning-input-field field-name="Versao__c" required data-id="versao"></lightning-input-field>
            <lightning-input-field field-name="Ano__c" required data-id="ano"></lightning-input-field>
            <lightning-input-field field-name="Descricao__c" data-id="desc"></lightning-input-field>
            <lightning-input-field field-name="Motor__c" data-id="motor"></lightning-input-field>
            <lightning-input-field field-name="Hibrido_Eletrico__c" data-id="hev"></lightning-input-field>
        </lightning-record-edit-form>
    </lightning-modal-body>
    <!-- Botões de ação -->
    <lightning-modal-footer>
        <div class="slds-grid slds-gutters">
            <lightning-button class="slds-m-right_medium slds-p-horizontal_small" variant="success" label="Cadastrar" onclick={handleCadastrarVeiculo}></lightning-button>
            <lightning-button class="slds-m-right_medium slds-p-horizontal_small" variant="neutral" label="Limpar Campos" onclick={handleLimparCampos} ></lightning-button>
        </div>
    </lightning-modal-footer>
</template>
